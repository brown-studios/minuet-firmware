# MINUET LID DIAGNOSTICS PACKAGE
#
# Provides optional diagnostic information about the lid's operation.

# Uses `defaults` instead of `substitutions` in optional package to prevent undefined variable
# warning in minimal configuration.
defaults:
  # Time between diagnostics reports.
  minuet_lid_diagnostics_report_interval: 1  # in seconds
  # When true, logs diagnostics without passing through the filters for faster updates.
  minuet_lid_diagnostics_log_unfiltered: false

switch:
  - id: !extend minuet_diagnostics
    on_turn_on:
      then:
        - lambda: |-
            id(minuet_lid_motor_current_filtered).update();

sensor:
  - id: minuet_lid_motor_current_filtered
    name: "Lid motor current"
    state_class: measurement
    device_class: current
    entity_category: diagnostic
    unit_of_measurement: A
    accuracy_decimals: 2
    platform: template
    update_interval: never
    filters:
      - timeout: ${minuet_lid_diagnostics_report_interval}s
      - lambda: |-
          static minuet::ThrottleFilterWithCriterion<minuet::MaxCriterion> filter{};
          return filter(x, ${(minuet_lid_diagnostics_report_interval * 1000)|round});
      - delta: 0.005
      - round_to_multiple_of: 0.01
      - lambda: |-
          return std::isnan(x) ? 0 : x;
    lambda: 'return id(minuet_lid_motor_current).state;'
    on_value:
      then:
        lambda: |-
          if (${"true" if not minuet_lid_diagnostics_log_unfiltered else "false"}) {
            ESP_LOGD(minuet::TAG, "Lid motor current: %.3f A", x);
          }
  - id: !extend minuet_lid_motor_current
    on_value:
      then:
        lambda: |-
          if (id(minuet_diagnostics).state) {
            if (${"true" if minuet_lid_diagnostics_log_unfiltered else "false"}) {
              ESP_LOGD(minuet::TAG, "Lid motor current: %.3f A", x);
            }
            id(minuet_lid_motor_current_filtered).update();
          }
