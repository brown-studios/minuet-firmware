    #   filters:
    #     - sliding_window_moving_average:
    #         window_size: 20
    #         send_every: 20
    update_interval: 3s  # PMSA003I internally updates every 2.3 s
  - platform: aqi
    id: minuet_air_quality_aqi
    name: "Air quality (AQI) from PMSA003I"
    icon: mdi:chemical-weapon
    pm_2_5: minuet_air_quality_pm_2_5
    pm_10_0: minuet_air_quality_pm_10_0
    calculation_type: AQI
    extended_range: true
  - platform: aqi
    id: minuet_air_quality_caqi
    name: "Air quality (CAQI) from PMSA003I"
    icon: mdi:chemical-weapon
    pm_2_5: minuet_air_quality_pm_2_5
    pm_10_0: minuet_air_quality_pm_10_0
    calculation_type: CAQI

packages:
  - ${minuet_package_accessory_air_quality_setup_condition if minuet_esphome_has_setup_condition else {}}
