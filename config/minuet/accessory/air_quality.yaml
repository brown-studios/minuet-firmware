    #   id: minuet_air_quality_pmc_1_0
    #   name: "Air PMC >1µm from PMSA003I"
    #   icon: mdi:chemical-weapon
    #   accuracy_decimals: 1
    #   filters:
    #     - sliding_window_moving_average:
    #         window_size: 20
