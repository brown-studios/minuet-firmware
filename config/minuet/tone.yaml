# MINUET TONE PACKAGE
#
# Provides customizable audible feedback in response to certain user interactions.

substitutions:
  # Library of audible feedback tones specified in the RTTTL language.
  #
  # The name of each tone indicates its severity and meaning.
  #
  # Prefix the tone name with '!' when it has high severity.  Use tones of high severity to
  # communicate faults and major configuration changes.  These tones are always played.
  #
  # Prefix the tone name with '?' when it has low severity.  Use tones of low severity to
  # confirm actions whose effects the user can observe immediately, such as when changing the
  # fan speed or turning on the thermostat (because an indicator lights up in response).
  # These tones are not played by default unless the user asks for more audible feedback.
  #
  # Do not add a prefix when a tone has normal severity.  Use tones of normal severity to confirm
  # actions whose effects are more subtle, such as when changing the thermostat setpoint (to help
  # the user count how many times they pressed up or down).  Be polite and use these tones sparingly
  # so the device isn't beeping all the time in normal use.  These tones are played by default
  # unless the user asks for less audible feedback.
  #
  # Sound design suggestions:
  #
  # - Start start on E6
  # - When incrementing a value: rise to G6
  # - When decrementing a value: fall to C6
  # - When enabling a feature: rise to A6
  # - When disabling a feature: fall to A5
  # - When resetting a feature: turn around E6, F6, E6, D6, E6
  # - Of course, if you're customizing this firmware you can change the tones to anything you like!
  #
  # Useful tool for testing tones: https://adamonsoon.github.io/rtttl-play/
  minuet_tones:
    # Low severity tones
    "?power_on": ""
    "?power_off": ""
    "?fan_speed_up": "d=16,o=4,b=144:32e6,32f6"
    "?fan_speed_down": "d=16,o=4,b=144:32e6,32d6"
    "?fan_speed_max": "d=16,o=4,b=144:32e6,32f6,32g6"
    "?fan_speed_min": "d=16,o=4,b=144:32e6,32d6,32c6"
    "?fan_dir_air_in": "d=16,o=4,b=144:32e6,32d6,8c6"
    "?fan_dir_air_out": "d=16,o=4,b=144:32e6,32f6,8g6"
    "?lid_open": ""
    "?lid_close": ""
    "?lid_stop": ""
    "?auto_on": ""
    "?auto_off": ""
    "?rain_on": ""
    "?rain_off": ""
    "?ir_confirm": ""
    "?light_change": ""
    "?keypad_indicators": ""
    # Normal severity tones
    "beep": "d=16,o=4,b=144:e6"
    "warn": "d=16,o=4,b=144:32e6,32p,e6"
    "forbidden": "d=16,o=4,b=144:32e6,32p,32e6,32p,32e6"
    "forbidden_by_rain_lock": "d=16,o=4,b=144:32e6,32p,32e6,32p,32e6,8p,32c6"
    "forbidden_by_battery_lock": "d=16,o=4,b=144:32e6,32p,32e6,32p,32e6,8p,32c6,32p,32c6"
    "forbidden_by_accessory_lock": "d=16,o=4,b=144:32e6,32p,32e6,32p,32e6,8p,32c6,32p,32c6,32p,32c6"
    "forbidden_by_manual_lock": "d=16,o=4,b=144:32e6,32p,32e6,32p,32e6,8p,32c6,32p,32c6,32p,32c6,32p,32c6"
    "forbidden_by_automation_lock": "d=16,o=4,b=144:32e6,32p,32e6,32p,32e6,8p,32c6,32p,32c6,32p,32c6,32p,32c6,32p,32c6"
    "minuet": "d=4,o=4,b=152:d5,8g4,8a4,8b4,8c5,d5,g4,g4,e5,32c5,32b4,16c5,8d5,8e5,8f#5,g5,g4,g4,32c5,32b4,16c5,8d5,8c5,8b4,8a4,b4,8c5,8b4,8a4,8g4,f#4,8g4,8a4,8b4,8g4,32b4,2a4.,d5,8g4,8a4,8b4,8c5,d5,g4,g4,e5,32c5,32b4,16c5,8d5,8e5,8f#5,g5,g4,g4,32c5,32b4,16c5,8d5,8c5,8b4,8a4,b4,8c5,8b4,8a4,8g4,a4,8b4,8a4,8g4,8f#4,2g4."
    "auto_reset": "d=16,o=4,b=144:32e6,32f6,32e6,32d6,8e6"
    "auto_temp_up": "d=16,o=4,b=144:e6,g6"
    "auto_temp_down": "d=16,o=4,b=144:e6,c6"
    "setting_1": "d=16,o=4,b=144:e6,p,32e6"
    "setting_2": "d=16,o=4,b=144:e6,p,32e6,32p,32e6"
    "setting_3": "d=16,o=4,b=144:e6,p,32e6,32p,32e6,32p,32e6"
    "setting_4": "d=16,o=4,b=144:e6,p,32e6,32p,32e6,32p,32e6,32p,32e6"
    "setting_5": "d=16,o=4,b=144:e6,p,32e6,32p,32e6,32p,32e6,32p,32e6,32p,32e6"
    "setting_6": "d=16,o=4,b=144:e6,p,32e6,32p,32e6,32p,32e6,32p,32e6,32p,32e6,32p,32e6"
    "setting_7": "d=16,o=4,b=144:e6,p,32e6,32p,32e6,32p,32e6,32p,32e6,32p,32e6,32p,32e6,32p,32e6"
    # High severity tones
    "!hold_action_1": "d=16,o=4,b=144:e6"
    "!lock_on": "d=16,o=4,b=144:32e6,32p,32e6,32p,8a6"
    "!lock_off": "d=16,o=4,b=144:32e6,32p,32e6,32p,8a5"
    "!controls_enhanced": "d=16,o=4,b=144:32e6,32p,32e6,32p,32e6,32p,8a6"
    "!controls_standard": "d=16,o=4,b=144:32e6,32p,32e6,32p,32e6,32p,8a5"
    "!radio_on": "d=16,o=4,b=144:32e6,32p,32e6,32p,32e6,32p,32e6,32p,8a6"
    "!radio_on_pair": "d=16,o=4,b=144:32e6,32p,32e6,32p,32e6,32p,32e6,32p,8a6,8p,8e6,8a6"
    "!radio_off": "d=16,o=4,b=144:32e6,32p,32e6,32p,32e6,32p,32e6,32p,8a5"
    "!power_on_restore": "d=16,o=4,b=144:32e6,32f6,32e6,32d6,8e6,8a6"
    "!power_on_default": "d=16,o=4,b=144:32e6,32f6,32e6,32d6,8e6,8a5"
    "!restart": "d=16,o=4,b=144:8e6,a4"
    "!factory_reset": "d=16,o=4,b=144:8e6,8a5,8e5,a4"
    "!failsafe_restart": "d=16,o=4,b=144:32e6,32p,32e6,32p,32e6,32p,32e6,32p,e6"
    "!fan_fault": "d=16,o=4,b=144:32e6,32p,32e6,32p,32e6"
    "!lid_timeout": "d=16,o=4,b=144:32e6,32p,32e6,32p,32e6,32p,32e6"
    "!lid_fault": "d=16,o=4,b=144:32e6,32p,32e6,32p,32e6,32p,32e6,32p,32e6"
    "!provisioned": "d=16,o=4,b=144:32c6,32d6,32e6,32f6,32g6,32a7,32b7,32c7"
  # The name of the tone to play by default if the requested tone is not present in the library
  # or if the body of the tone is empty.
  minuet_tone_default: "beep"

esphome:
  includes:
    - minuet/tone.h

output:
  - id: minuet_tone_pwm
    platform: ledc
    pin:
      number: 7
      mode: output
      inverted: false
    channel: 4

rtttl:
  - id: minuet_tone_generator
    output: minuet_tone_pwm

select:
  - id: minuet_audible_feedback
    platform: template
    name: "Audible feedback"
    icon: mdi:volume-high
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "Polite"  # Play normal or high severity tones
      - "More"  # Play high severity tones only
      - "Less"  # Play all tones

script:
  - id: minuet_tone
    parameters:
      name: string
    then:
      - lambda: |-
          static constexpr const char* DEFAULT_TONE_NAME = "${minuet_tone_default}";
          static constexpr const char* TONES[] = {
            <% for item in minuet_tones | items %>
            "${item[0]}:${item[1] if item[1] != '' else minuet_tones[minuet_tone_default]}",
            <% endfor %>
          };
          for (;;) {
            for (size_t i = 0; i < sizeof(TONES) / sizeof(TONES[0]); i++) {
              const char* tone = TONES[i];
              char* colon_pos = strchr(tone, ':');
              if (!colon_pos) {
                ESP_LOGD(minuet::TAG, "Tone library entry missing colon: '%s'", tone);
                continue;
              }
              size_t name_length = colon_pos - tone;
              if (name.size() == name_length && strncmp(name.c_str(), tone, name_length) == 0) {
                if (colon_pos[1]) { // ensure tone body is not empty
                  id(minuet_tone_rtttl)->execute(tone);
                }
                return;
              }
            }
            ESP_LOGD(minuet::TAG, "Tone '%s' not found", name.c_str());
            if (name == DEFAULT_TONE_NAME) {
              return;
            }
            name = DEFAULT_TONE_NAME;
          }
  - id: minuet_tone_rtttl
    parameters:
      tone: string
    then:
      - lambda: |-
          const size_t setting = id(minuet_audible_feedback).active_index().value_or(0);
          const char severity = tone[0];
          switch (setting) {
            case 0: // Polite
              if (severity == '?') return;
              break;
            case 1: // More
              break;
            case 2: // Less
              if (severity != '!') return;
              break;
          }
          id(minuet_tone_generator).play(tone);

button:
  - id: minuet_tone_beep
    name: Beep
    icon: mdi:alert
    entity_category: config
    disabled_by_default: ${minuet_use_disabled_by_default}
    platform: template
    on_press:
      then:
        - script.execute:
            id: minuet_tone
            name: beep
