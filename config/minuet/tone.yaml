# MINUET TONE PACKAGE
#
# Provides customizable audible feedback in response to certain user interactions.

substitutions:
  # Library of audible feedback tones specified in the RTTTL language.
  #
  # The name of each tone indicates its severity and meaning.
  #
  # Prefix the tone name with '!' when it has high severity.  Use tones of high severity to
  # communicate faults and major configuration changes.  These tones are always played.
  #
  # Prefix the tone name with '?' when it has low severity.  Use tones of low severity to
  # confirm actions whose effects the user can observe immediately, such as when changing the
  # fan speed or turning on the thermostat (because an indicator lights up in response).
  # These tones are not played by default unless the user asks for more audible feedback.
  #
  # Do not add a prefix when a tone has normal severity.  Use tones of normal severity to confirm
  # actions whose effects are more subtle, such as when changing the thermostat target temperature
  # (to help the user count how many times they pressed up or down).  Be polite and use these tones
  # sparingly so the device isn't beeping all the time in normal use.  These tones are played by
  # default unless the user asks for less audible feedback.
  #
  # Sound design suggestions:
  #
  # - Start start on E6
  # - When incrementing a value: rise to G6
  # - When decrementing a value: fall to C6
  # - When enabling a feature: rise to A6
  # - When disabling a feature: fall to A5
  # - When resetting a feature: turn around E6, F6, E6, D6, E6
  # - Of course, if you're customizing this firmware you can change the tones to anything you like!
  #
  # Useful tool for testing tones: https://adamonsoon.github.io/rtttl-play/
  minuet_tones:
    # Default tone (must be first)
    "beep": "d=8,o=4,b=576:e6"
    # Low severity tones
    "?power_on": ""
    "?power_off": ""
    "?fan_dir_air_in": "d=8,o=4,b=576:e6,d6,2c6"
    "?fan_dir_air_out": "d=8,o=4,b=576:e6,f6,2g6"
    "?lid_open": ""
    "?lid_close": ""
    "?lid_stop": ""
    "?auto_on": ""
    "?auto_off": ""
    "?rain_on": ""
    "?rain_off": ""
    "?light_change": ""
    "?keypad_indicators": ""
    # Normal severity tones
    "warn": "d=8,o=4,b=576:e6,p,e6"
    "forbidden": "d=8,o=4,b=576:e6,p,e6,p,e6"
    "forbidden_by_rain_lock": "d=8,o=4,b=576:e6,p,e6,p,e6,2p,c6"
    "forbidden_by_battery_lock": "d=8,o=4,b=576:e6,p,e6,p,e6,2p,c6,p,c6"
    "forbidden_by_accessory_lock": "d=8,o=4,b=576:e6,p,e6,p,e6,2p,c6,p,c6,p,c6"
    "forbidden_by_manual_lock": "d=8,o=4,b=576:e6,p,e6,p,e6,2p,c6,p,c6,p,c6,p,c6"
    "forbidden_by_automation_lock": "d=8,o=4,b=576:e6,p,e6,p,e6,2p,c6,p,c6,p,c6,p,c6,p,c6"
    "minuet": "d=4,o=4,b=152:d5,8g4,8a4,8b4,8c5,d5,g4,g4,e5,32c5,32b4,16c5,8d5,8e5,8f#5,g5,g4,g4,32c5,32b4,16c5,8d5,8c5,8b4,8a4,b4,8c5,8b4,8a4,8g4,f#4,8g4,8a4,8b4,8g4,32b4,2a4.,d5,8g4,8a4,8b4,8c5,d5,g4,g4,e5,32c5,32b4,16c5,8d5,8e5,8f#5,g5,g4,g4,32c5,32b4,16c5,8d5,8c5,8b4,8a4,b4,8c5,8b4,8a4,8g4,a4,8b4,8a4,8g4,8f#4,2g4."
    "auto_reset": "d=8,o=4,b=576:e6,f6,e6,d6,2e6"
    "auto_temp_up": "d=8,o=4,b=576:e6,g6"
    "auto_temp_down": "d=8,o=4,b=576:e6,c6"
    "setting_1": "d=8,o=4,b=576:p,2e6,2p,g6"
    "setting_2": "d=8,o=4,b=576:p,2e6,2p,g6,p,g6"
    "setting_3": "d=8,o=4,b=576:p,2e6,2p,g6,p,g6,p,g6"
    "setting_4": "d=8,o=4,b=576:p,2e6,2p,g6,p,g6,p,g6,p,g6"
    "setting_5": "d=8,o=4,b=576:p,2e6,2p,g6,p,g6,p,g6,p,g6,p,g6"
    "setting_6": "d=8,o=4,b=576:p,2e6,2p,g6,p,g6,p,g6,p,g6,p,g6,p,g6"
    # High severity tones
    "!hold_action_1": "d=8,o=4,b=576:e6"
    "!hold_action_2": "d=8,o=4,b=576:e6,p,e6"
    "!lock_on": "d=8,o=4,b=576:e6,p,e6,p,2a6"
    "!lock_off": "d=8,o=4,b=576:e6,p,e6,p,2a5"
    "!controls_enhanced": "d=8,o=4,b=576:e6,p,e6,p,e6,p,2a6"
    "!controls_standard": "d=8,o=4,b=576:e6,p,e6,p,e6,p,2a5"
    "!radio_on": "d=8,o=4,b=576:e6,p,e6,p,e6,p,e6,p,2a6"
    "!radio_on_pair": "d=8,o=4,b=576:e6,p,e6,p,e6,p,e6,p,2a6,2p,2e6,2a6"
    "!radio_off": "d=8,o=4,b=576:e6,p,e6,p,e6,p,e6,p,2a5"
    "!power_on_restore": "d=8,o=4,b=576:e6,f6,e6,d6,2e6,2a6"
    "!power_on_default": "d=8,o=4,b=576:e6,f6,e6,d6,2e6,2a5"
    "!restart": "d=8,o=4,b=576:2e6,2a4"
    "!factory_reset": "d=8,o=4,b=576:2e6,2a5,2e5,2a4"
    "!failsafe_restart": "d=8,o=4,b=576:e6,p,e6,p,e6,p,e6,p,2e6"
    "!fan_fault": "d=8,o=4,b=576:e6,p,e6,p,e6"
    "!lid_fault": "d=8,o=4,b=576:e6,p,e6,p,e6,p,e6"
    "!provisioned": "d=8,o=4,b=576:c6,d6,e6,f6,g6,a7,b7,c7"
    "!update_requested": "d=8,o=4,b=576:e6,p,e6,2p,a7,p,a7"
    "!update_error": "d=8,o=4,b=576:e6,p,e6"
    "!update_not_available": "d=8,o=4,b=576:a7,p,a7,2p,e6,p,e6"
    "!update_started": "d=8,o=4,b=576:e6,p,e6,2p,a7,p,a7,2p,b7,p,b7"
    "!update_completed": "d=8,o=4,b=576:e6,p,e6,2p,a7,p,a7,2p,b7,p,b7,2p,e7,p,e7"

esphome:
  includes:
    - minuet/tone.h

output:
  - id: minuet_tone_pwm
    platform: ledc
    pin:
      number: 7
      mode: output
      inverted: false
    channel: 4

rtttl:
  - id: minuet_tone_generator
    output: minuet_tone_pwm

select:
  - id: minuet_audible_feedback
    platform: template
    name: "Audible feedback"
    icon: mdi:volume-high
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "Polite"  # Play normal or high severity tones
      - "More"  # Play high severity tones only
      - "Less"  # Play all tones

script:
  - id: minuet_tone
    parameters:
      name: StringRef
    then:
      - lambda: |-
          static constexpr const char* TONES[] = {
            <% for item in minuet_tones | items %>
            "${item[0]}:${item[1] if item[1] != '' else minuet_tones['beep']}",
            <% endfor %>
          };
          for (size_t i = 0; i < sizeof(TONES) / sizeof(TONES[0]); i++) {
            const char* tone = TONES[i];
            char* colon_pos = strchr(tone, ':');
            if (!colon_pos) {
              continue;
            }
            size_t name_length = colon_pos - tone;
            if (name.size() == name_length && strncmp(name.c_str(), tone, name_length) == 0) {
              minuet::tone::play_rtttl(tone);
              return;
            }
          }
          ESP_LOGD(minuet::TAG, "Tone not found: %s", name.c_str());
          minuet::tone::play_rtttl(TONES[0]);

button:
  - id: minuet_tone_beep
    name: Beep
    icon: mdi:alert
    disabled_by_default: ${minuet_use_disabled_by_default}
    platform: template
    on_press:
      then:
        - lambda: |-
            minuet::tone::play_beep();
